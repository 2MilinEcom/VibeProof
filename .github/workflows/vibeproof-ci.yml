name: VibeProof CI

on:
  push:
    branches: ["launch-ready", "main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/vibe-proof
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibeproof
      SHOPIFY_API_KEY: ci
      SHOPIFY_API_SECRET: ci-secret
      SHOPIFY_APP_URL: https://example.invalid
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibeproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/vibe-proof/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
